<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Escolha o Tipo de Documento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="index.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="container">
    <section class="escolha-empresa">

      <h1>Escolha o documento</h1>
      <p>Agora selecione o tipo de documento que você quer gerar.</p>

      <div class="empresas">

        <div class="empresa doc" data-doc="contrato">
          <h2>Contrato</h2>
          <p>Prestação de serviço</p>
          <button>Selecionar</button>
        </div>

        <div class="empresa doc" data-doc="recibo">
          <h2>Recibo</h2>
          <p>Comprovante de pagamento</p>
          <button>Selecionar</button>
        </div>

        <div class="empresa doc" data-doc="orcamento">
          <h2>Orçamento</h2>
          <p>Proposta comercial</p>
          <button>Selecionar</button>
        </div>

      </div>

      <br>


    </section>
  </main>

  <script src="/site/js/tipo.js"></script>
  <script src="/site/js/footer.js"></script>
</body>
</html>
